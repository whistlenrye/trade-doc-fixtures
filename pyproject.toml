[project]
name = "trade-doc-fixtures"
version = "0.1.0"
description = "Synthetic gold trade documents and a field scorer for DocFlow extractions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Whistle and Rise" }]

[project.scripts]
trade-doc-score = "trade_doc_fixtures.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
